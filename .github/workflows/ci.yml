name: cxx-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_EXTERNAL_TESTS=OFF -DENABLE_SOCKET_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DENABLE_EXTERNAL_TESTS=OFF -DENABLE_SOCKET_TESTS=OFF
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
